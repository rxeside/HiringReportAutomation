services:
  web:
    build: .
    ports:
      - "8000:8000"
#    dns:
#      - 8.8.8.8
#      - 1.1.1.1
    volumes:
      - ./app:/app/app
      - ./templates:/app/templates
      - ./cache:/app/cache
      - ./static:/app/static
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - web