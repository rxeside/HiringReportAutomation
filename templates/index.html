{% extends "base.html" %}

{% block content %}
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<div id="app">
    <header class="header">
        <h1>Воронка найма (Analytics)</h1>
        <div class="last-updated">Данные обновлены: <span id="last-updated-date">-</span></div>
    </header>

    <div class="card toolbar-card">
        <div class="filter-group">
            <label>Период:</label>
            <div class="date-inputs">
                <input type="date" id="date-start" class="form-control">
                <span>&mdash;</span>
                <input type="date" id="date-end" class="form-control">
            </div>
        </div>

        <div class="filter-group" style="flex-grow: 1;">
            <label>Вакансии:</label>
            <select id="vacancy-select" multiple placeholder="Выберите вакансии..."></select>
        </div>

         <div class="filter-group">
            <label>Рекрутер:</label>
            <select id="recruiter-select" multiple placeholder="Все рекрутеры..."></select>
        </div>

        <div class="filter-actions">
            <button id="apply-filters" class="btn btn-primary">Применить</button>
        </div>
    </div>

    <div class="kpi-grid">
        <div class="card kpi-card">
            <div class="kpi-title">Всего кандидатов</div>
            <div class="kpi-value" id="kpi-total">0</div>
        </div>
        <div class="card kpi-card">
            <div class="kpi-title">Средний срок до оффера</div>
            <div class="kpi-value" id="kpi-time">0 <span class="unit">дн.</span></div>
        </div>
         <div class="card kpi-card">
            <div class="kpi-title">Принято офферов</div>
            <div class="kpi-value" id="kpi-hired">0</div>
        </div>
    </div>

    <div class="main-grid">

        <div class="card chart-card">
            <h3>Воронка кандидатов</h3>
            <div class="chart-container">
                <canvas id="funnelChart"></canvas>
            </div>
        </div>

        <div class="card table-card">
            <h3>Поэтапная конверсия</h3>
            <div class="table-responsive">
                <table class="data-table" id="conversion-table">
                    <thead>
                        <tr>
                            <th>Этап</th>
                            <th class="text-right">Кол-во</th>
                            <th class="text-right">Conv (шаг)</th>
                            <th class="text-right">Conv (общ)</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="bottom-grid">
         <div class="card chart-card">
            <h3>Причины отказов (Топ 10)</h3>
            <div class="chart-container">
                <canvas id="rejectionChart"></canvas>
            </div>
        </div>
         <div class="card list-card">
            <h3>Источники</h3>
            <div id="sources-list" class="simple-list"></div>
        </div>
    </div>
</div>
{% endblock %}
